<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography</title>
<style>
  :root {
    --paper: #f7f8f8;
    --ink: #1d2124;
    --muted: #666d73;
    --line: #d5d9db;
    --focus: #2a5d73;
    --error: #a3301f;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* Home: three full-width bands */
  #home { min-height: 100vh; display: flex; flex-direction: column; }
  .option {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2rem;
    padding: 2.5rem clamp(1.25rem, 5vw, 4rem);
    min-height: 30vh;
    background: transparent;
    border: 0;
    border-top: 1px solid var(--line);
    text-align: left;
    cursor: pointer;
    transition: background-color .2s ease, color .2s ease;
  }
  .option:first-child { border-top: 0; }
  .option .title {
    font-size: clamp(2.25rem, 6.5vw, 5rem);
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .option .desc {
    max-width: 18rem;
    color: var(--muted);
    font-size: 0.95rem;
    transition: color .2s ease;
  }
  .option:hover, .option:focus-visible { background: var(--ink); color: var(--paper); }
  .option:hover .desc, .option:focus-visible .desc { color: #b9bfc3; }
  .option:focus-visible { outline-offset: -4px; outline-color: var(--paper); }

  /* Inner pages */
  .page { min-height: 100vh; padding: 1.5rem clamp(1.25rem, 5vw, 4rem) 4rem; }
  .back {
    background: none; border: 0; padding: .25rem 0; cursor: pointer;
    color: var(--muted); font-size: .95rem;
    text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line);
  }
  .back:hover { color: var(--ink); }
  h1 {
    margin: 3rem 0 .5rem;
    font-size: clamp(2rem, 4.5vw, 3.25rem);
    font-weight: 300;
    letter-spacing: -0.025em;
    line-height: 1.05;
  }
  .lede { margin: 0 0 2.5rem; color: var(--muted); max-width: 34rem; }

  form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; max-width: 34rem; }
  .field { flex: 1 1 14rem; display: flex; flex-direction: column; gap: .4rem; }
  label { font-size: .9rem; color: var(--muted); }
  input[type="text"] {
    width: 100%; padding: .75rem .9rem; background: #fff;
    border: 1px solid #aeb4b8; border-radius: 2px;
  }
  input[type="text"]:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
  .submit {
    padding: .8rem 1.5rem; background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); border-radius: 2px; cursor: pointer;
  }
  .submit:hover { background: #000; }
  .submit:disabled { opacity: .55; cursor: wait; }
  #status { min-height: 1.5rem; margin: 1rem 0 0; font-size: .95rem; color: var(--muted); }
  #status.error { color: var(--error); }

  /* Progress bar */
  #progress { max-width: 34rem; margin: .75rem 0 0; }
  .bar {
    position: relative; height: 6px; background: var(--line);
    border-radius: 3px; overflow: hidden;
  }
  #barfill {
    height: 100%; width: 0; background: var(--ink);
    transition: width .2s ease;
  }
  #progress.indeterminate #barfill {
    position: absolute; width: 35%;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }
  #ptext { display: block; margin-top: .4rem; font-size: .85rem; color: var(--muted); }

  /* Gallery */
  #results { margin-top: 2.5rem; }
  .results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 1rem; }
  .results-head h2 { margin: 0; font-size: 1.25rem; font-weight: 400; }
  .results-head span { color: var(--muted); font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 6px; }
  .thumb { padding: 0; border: 0; background: #e3e6e8; cursor: zoom-in; aspect-ratio: 3 / 2; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb:hover img { opacity: .9; }
  .thumb.pending { cursor: progress; }
  .thumb.failed { cursor: default; position: relative; }
  .thumb.failed::after {
    content: "Failed to load"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--error); font-size: .85rem;
  }

  /* Lightbox */
  #lightbox {
    position: fixed; inset: 0; z-index: 10; background: rgba(17, 19, 21, .96);
    display: flex; flex-direction: column;
  }
  .lb-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; color: #c9cfd3; font-size: .95rem; }
  .lb-bar button, .lb-nav button {
    background: none; border: 1px solid #4a5156; color: #e8ebed;
    padding: .5rem 1rem; border-radius: 2px; cursor: pointer;
  }
  .lb-bar button:hover, .lb-nav button:hover { background: #2a2f33; }
  #lbstage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 1.25rem; }
  #lbimg { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-nav { display: flex; justify-content: center; gap: .75rem; padding: 1rem; }

  @media (max-width: 640px) {
    .option { flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: .75rem; padding-top: 2rem; padding-bottom: 2rem; }
    .submit { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    #progress.indeterminate #barfill { animation: none; left: 0; width: 100%; opacity: .4; }
  }
</style>
</head>
<body>

<main id="home">
  <button class="option" data-go="booking">
    <span class="title">Booking</span>
    <span class="desc">Schedule a session.</span>
  </button>
  <button class="option" data-go="photos">
    <span class="title">See photos</span>
    <span class="desc">Browse previews of your gallery.</span>
  </button>
  <button class="option" data-go="receive">
    <span class="title">Receive photos &amp; pay</span>
    <span class="desc">Get your full-resolution images.</span>
  </button>
</main>

<section id="booking" class="page" hidden>
  <button class="back" data-go="home">Back</button>
  <h1>Booking</h1>
  <p class="lede">Booking is not open yet.</p>
</section>

<section id="receive" class="page" hidden>
  <button class="back" data-go="home">Back</button>
  <h1>Receive photos &amp; pay</h1>
  <p class="lede">Payment and downloads are not available yet.</p>
</section>

<section id="photos" class="page" hidden>
  <button class="back" data-go="home">Back</button>
  <h1>See photos</h1>
  <p class="lede">Enter your name exactly as it was given when you booked. Previews are reduced in size and quality.</p>

  <form id="lookup" autocomplete="off">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" required maxlength="100">
    </div>
    <button class="submit" type="submit">View photos</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <div id="progress" hidden>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading photos">
      <div id="barfill"></div>
    </div>
    <span id="ptext"></span>
  </div>

  <div id="results" hidden>
    <div class="results-head"><h2 id="who"></h2><span id="count"></span></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-bar"><span id="lbcount"></span><button id="lbclose" type="button">Close</button></div>
  <div id="lbstage"><img id="lbimg" alt=""></div>
  <div class="lb-nav">
    <button id="lbprev" type="button">Previous</button>
    <button id="lbnext" type="button">Next</button>
  </div>
</div>

<script>
(function () {
  // Address of the Mac mini's tunnel (see setup steps)
  var API_BASE = "https://files.declan.fun";

  var GALLERY_TTL_MS = 5 * 60 * 1000;   // reuse a looked-up gallery list for 5 minutes
  var IMAGE_TIMEOUT_MS = 60000;         // give up on a single photo after this long
  var IMAGE_TRIES = 2;                  // each photo is tried this many times

  var views = ["home", "booking", "photos", "receive"];
  var $ = function (id) { return document.getElementById(id); };

  /* Navigation (uses the URL hash so the browser Back button works) */
  function route() {
    var id = location.hash.slice(1);
    if (views.indexOf(id) === -1) id = "home";
    views.forEach(function (v) { $(v).hidden = (v !== id); });
    closeLightbox();
    window.scrollTo(0, 0);
    if (id === "photos") $("name").focus({ preventScroll: true });
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go]");
    if (!el) return;
    var dest = el.getAttribute("data-go");
    location.hash = dest === "home" ? "" : dest;
    if (dest === "home") route();
  });
  window.addEventListener("hashchange", route);

  /* Gallery lookup */
  var photos = [];
  var current = 0;
  var loadToken = 0;                    // bumps on every new lookup, cancels the previous loader
  var status = $("status");

  function setStatus(msg, isError) {
    status.textContent = msg || "";
    status.className = isError ? "error" : "";
  }

  /* Progress bar: indeterminate while looking up, then n of total */
  function showProgress(text, done, total) {
    var box = $("progress");
    var bar = box.querySelector(".bar");
    box.hidden = false;
    $("ptext").textContent = text || "";
    if (total == null) {
      box.className = "indeterminate";
      $("barfill").style.width = "";
      bar.removeAttribute("aria-valuenow");
    } else {
      box.className = "";
      var pct = total ? Math.round((done / total) * 100) : 100;
      $("barfill").style.width = pct + "%";
      bar.setAttribute("aria-valuenow", String(pct));
    }
  }
  function hideProgress() { $("progress").hidden = true; }

  /* Gallery list cache (per tab) so repeating a lookup is instant */
  function cacheKey(name) { return "gallery240c:" + name.trim().toLowerCase(); }
  function readCache(name) {
    try {
      var raw = sessionStorage.getItem(cacheKey(name));
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.t > GALLERY_TTL_MS) return null;
      return obj.data;
    } catch (err) { return null; }
  }
  function writeCache(name, data) {
    try { sessionStorage.setItem(cacheKey(name), JSON.stringify({ t: Date.now(), data: data })); }
    catch (err) { /* storage full or blocked: just skip caching */ }
  }

  $("lookup").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("name").value.trim();
    if (!name) return;
    var btn = e.target.querySelector("button");
    var token = ++loadToken;
    btn.disabled = true;
    $("results").hidden = true;
    setStatus("");

    var cached = readCache(name);
    if (cached) {
      btn.disabled = false;
      showGallery(cached, token);
      return;
    }

    showProgress("Looking for your gallery...", 0, null);

    fetch(API_BASE + "/api/gallery?name=" + encodeURIComponent(name))
      .then(function (r) {
        return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
      })
      .then(function (res) {
        if (token !== loadToken) return;
        if (!res.ok) {
          hideProgress();
          if (res.status === 429) setStatus("Too many attempts. Wait a minute and try again.", true);
          else if (res.status === 404) setStatus("No gallery found for that name. Check the spelling and try again.", true);
          else setStatus("The photo server had a problem. Try again in a moment.", true);
          return;
        }
        writeCache(name, res.data);
        showGallery(res.data, token);
      })
      .catch(function () {
        if (token !== loadToken) return;
        hideProgress();
        setStatus("Could not reach the server. Try again in a moment.", true);
      })
      .finally(function () { btn.disabled = false; });
  });

  function showGallery(data, token) {
    photos = data.photos.map(function (p) { return { url: API_BASE + p.url, ok: false }; });
    $("who").textContent = data.folder;
    $("count").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
    var grid = $("grid");
    grid.textContent = "";

    // Empty slots appear immediately; each one is filled in as its photo arrives.
    photos.forEach(function (p, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "thumb pending";
      b.setAttribute("aria-label", "Open photo " + (i + 1));
      b.addEventListener("click", function () { if (photos[i].ok) openLightbox(i); });
      p.slot = b;
      grid.appendChild(b);
    });
    $("results").hidden = false;

    if (!photos.length) {
      hideProgress();
      setStatus("This gallery has no photos yet.");
      return;
    }
    loadSequentially(token);
  }

  /* Pull photos one at a time, in order, with a progress bar */
  function loadOne(url, triesLeft, cb) {
    var img = new Image();
    var finished = false;
    var timer = setTimeout(function () { settle(false); }, IMAGE_TIMEOUT_MS);

    function settle(ok) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      img.onload = img.onerror = null;
      if (ok) return cb(true, img);
      img.src = "";                                  // stop the stalled request
      if (triesLeft > 1) return loadOne(url, triesLeft - 1, cb);
      cb(false, null);
    }
    img.onload = function () { settle(true); };
    img.onerror = function () { settle(false); };
    img.decoding = "async";
    img.alt = "";
    img.src = url;
  }

  function loadSequentially(token) {
    var total = photos.length, index = 0, done = 0, failed = 0;
    showProgress("Loading photo 1 of " + total, 0, total);

    function next() {
      if (token !== loadToken) return;               // a newer lookup took over
      if (index >= total) return finish();
      var i = index++;
      loadOne(photos[i].url, IMAGE_TRIES, function (ok, img) {
        if (token !== loadToken) return;
        var slot = photos[i].slot;
        slot.classList.remove("pending");
        if (ok) {
          photos[i].ok = true;
          slot.appendChild(img);
        } else {
          slot.classList.add("failed");
          slot.disabled = true;
          failed++;
        }
        done++;
        showProgress(done < total ? "Loading photo " + (done + 1) + " of " + total
                                  : "Loaded " + total + " of " + total, done, total);
        next();
      });
    }

    function finish() {
      hideProgress();
      if (failed) setStatus(failed + (failed === 1 ? " photo" : " photos") + " could not be loaded. Search again to retry.", true);
      else setStatus("");
    }
    next();
  }

  /* Lightbox */
  var lastFocus = null;
  function openLightbox(i) {
    lastFocus = document.activeElement;
    $("lightbox").hidden = false;
    document.body.style.overflow = "hidden";
    show(i, 1);
    $("lbclose").focus();
  }
  function closeLightbox() {
    if ($("lightbox").hidden) return;
    $("lightbox").hidden = true;
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }
  // step is +1 or -1 so Previous/Next skip any photo that failed to load
  function show(i, step) {
    var n = photos.length;
    if (!n) return;
    var idx = ((i % n) + n) % n;
    for (var tries = 0; tries < n && !photos[idx].ok; tries++) {
      idx = (((idx + step) % n) + n) % n;
    }
    current = idx;
    $("lbimg").src = photos[current].url;
    $("lbcount").textContent = (current + 1) + " of " + n;
  }
  $("lbclose").addEventListener("click", closeLightbox);
  $("lbprev").addEventListener("click", function () { show(current - 1, -1); });
  $("lbnext").addEventListener("click", function () { show(current + 1, 1); });
  document.addEventListener("keydown", function (e) {
    if ($("lightbox").hidden) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") show(current - 1, -1);
    if (e.key === "ArrowRight") show(current + 1, 1);
  });

  route();
})();
</script>
</body>
</html>
